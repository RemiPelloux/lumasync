[package]
name = "lumasync"
version = "0.2.0"
description = "Local Philips Hue screen lighting"
authors = ["LumaSync contributors"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "lumasync_lib"
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
aes-gcm = "0.10"
getrandom = "0.3"
hex = "0.4"
hmac = "0.12"
image = { version = "0.25", default-features = false }
keyring = "4.2"
mdns-sd = "0.21"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2.11", features = [] }
tokio = { version = "1", features = ["time", "macros"] }
uuid = "1"
xcap = "0.9.8"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
panic = "abort"
strip = true

[profile.release.package."*"]
opt-level = 3
